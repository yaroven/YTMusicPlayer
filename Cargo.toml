[package]
name = "ytm-player"
version = "0.6.0"
edition = "2024"
rust-version = "1.85"
description = "Lightweight cross-platform YouTube Music player: terminal UI and a desktop window"
repository = "https://github.com/yaroven/YTMusicPlayer"
homepage = "https://github.com/yaroven/YTMusicPlayer"
license = "MIT OR Apache-2.0"
publish = false

[[bin]]
name = "ytm"
path = "src/main.rs"

[features]
default = ["gui"]
# Desktop window (`ytm gui`); off => terminal-only, smaller binary.
gui = ["dep:slint", "dep:image", "dep:notify-rust", "dep:tray-icon", "dep:ksni"]

[dependencies]
# --- Async runtime -----------------------------------------------------------
tokio = { version = "1.47", features = [
    "rt-multi-thread",
    "macros",
    "process",   # yt-dlp child process
    "fs",
    "io-util",
    "sync",      # mpsc/watch channels between UI <-> player <-> sync
    "time",
    "signal",
    "net",       # loopback listener for the OAuth redirect
] }
futures-util = "0.3"

# --- HTTP / OAuth ------------------------------------------------------------
# rustls instead of OpenSSL: no system libssl on Linux, no vcpkg on Windows.
reqwest = { version = "0.12", default-features = false, features = [
    "rustls-tls",
    "http2",
    "charset",
    "system-proxy",
    "json",
    "gzip",
    "stream",
] }
# Reuses our reqwest (same 0.12 major) for the token exchange; PKCE is built in.
oauth2 = { version = "5.0", default-features = false, features = ["reqwest"] }
url = "2.5"
open = "5.3"         # opens the consent URL in the default browser

# --- Credentials ---------------------------------------------------------------
# v4 default ("v1" feature): Keychain on macOS, Credential Manager on Windows,
# Secret Service over pure-Rust zbus on Linux (no libdbus-dev needed).
keyring = "4.2"

# --- Audio -------------------------------------------------------------------
# rodio pulls cpal (CoreAudio / ALSA / WASAPI) and symphonia. Use `rodio::cpal`
# instead of a direct cpal dependency to avoid two cpal versions in the tree.
# Note: symphonia 0.5 has no Opus decoder, so we play AAC (m4a, itag 140).
rodio = { version = "0.22", default-features = false, features = [
    "playback",
    "mp4",          # symphonia isomp4 demuxer + AAC decoder
    "mp3",
    "vorbis",
    "flac",
    "wav",
] }

# --- Local storage -----------------------------------------------------------
# "bundled" compiles SQLite in: identical behavior on every OS, no system lib.
rusqlite = { version = "0.40", features = ["bundled", "chrono", "serde_json"] }

# --- TUI ---------------------------------------------------------------------
ratatui = "0.30"
# Must match ratatui's crossterm (0.29). "event-stream" gives async EventStream.
crossterm = { version = "0.29", features = ["event-stream"] }

# --- Config / paths / serialization ------------------------------------------
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "1.0"
directories = "6.0" # XDG on Linux, ~/Library on macOS, %APPDATA% on Windows
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }

# --- yt-dlp management -------------------------------------------------------
which = "8.0"
sha2 = "0.11"
hex = "0.4"

# --- Errors / logging --------------------------------------------------------
thiserror = "2.0"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2" # log to file: stdout belongs to the TUI

# --- GUI (optional) -----------------------------------------------------------
# Software renderer: no GPU stack; measured the lightest option (34 MB idle
# vs 49 MB FLTK, 78 MB egui). Royalty-free license: keep the "Made with
# Slint" attribution visible in the GUI.
slint = { version = "1.18", optional = true, default-features = false, features = [
    "std",
    "compat-1-2",
    "backend-winit",
    "renderer-software",
    # Window access to raise it when a second launch asks for it.
    "unstable-winit-030",
] }
# Album art (GUI): JPEG decode + scale of YouTube thumbnails only.
notify-rust = { version = "4.18", optional = true, default-features = false, features = ["z-with-tokio"] }
image = { version = "0.25", optional = true, default-features = false, features = ["jpeg", "png"] }

# Unpacks the onedir yt-dlp zip.
zip = { version = "7.2.0", default-features = false, features = ["deflate"] }

# Media keys + "Now Playing" (MPRIS over pure-Rust zbus on Linux, SMTC on
# Windows, where it needs the GUI window's handle).
souvlaki = { version = "0.8", default-features = false, features = ["use_zbus"] }
# Chromecast: TLS to the device (reqwest already brings these in).
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
md5 = "0.8"              # Last.fm request signatures
discord-rich-presence = "1.1"  # Discord "Listening to" status over local IPC

# Tray icon: StatusNotifierItem over zbus on Linux, native elsewhere.
[target.'cfg(target_os = "linux")'.dependencies]
ksni = { version = "0.3", optional = true }

[target.'cfg(not(target_os = "linux"))'.dependencies]
tray-icon = { version = "0.26", optional = true, default-features = false }

# Process memory (macOS `proc_pid_rusage`), quiet SIGPIPE handling.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Hides the console window when the GUI is started from the Start menu.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Console"] }

# Main-thread run loop for media key handlers.
[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"

# Tests: a self-signed certificate for the fake Cast receiver.
[dev-dependencies]
rcgen = { version = "0.14", default-features = false, features = ["ring", "crypto"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"

# --- Linux packages (release workflow) ----------------------------------------
# `cargo deb` / `cargo generate-rpm` turn the release binary into .deb/.rpm.
# Shared-library deps are detected automatically; the window's X11/Wayland
# libraries are loaded at runtime, so they are listed by hand.
[package.metadata.deb]
maintainer = "yaroven <yaroven@users.noreply.github.com>"
section = "sound"
priority = "optional"
depends = "$auto, fontconfig, libxkbcommon0"
recommends = "libxkbcommon-x11-0, libwayland-client0, libxcursor1, libxi6, libxrandr2, pipewire-alsa | libasound2-plugins, gnome-keyring | kwalletmanager"
extended-description = """\
Plays your YouTube Music likes and playlists with a fraction of the memory
of the browser tab. Terminal UI (`ytm`) and a desktop window (`ytm gui`)."""
assets = [
    ["target/release/ytm", "usr/bin/", "755"],
    ["packaging/linux/ytm-player.desktop", "usr/share/applications/", "644"],
    ["assets/ytm-player.png", "usr/share/icons/hicolor/256x256/apps/", "644"],
    ["README.md", "usr/share/doc/ytm-player/", "644"],
]

[package.metadata.generate-rpm]
name = "ytm-player"
# Automatic detection runs `ldd` on the (Ubuntu) build host and lists
# transitive libraries under Debian sonames (libbz2.so.1.0), which Fedora
# lacks. The binary itself needs libc, libgcc_s, libasound, libfontconfig.
auto-req = "no"
assets = [
    { source = "target/release/ytm", dest = "/usr/bin/ytm", mode = "755" },
    { source = "packaging/linux/ytm-player.desktop", dest = "/usr/share/applications/ytm-player.desktop", mode = "644" },
    { source = "assets/ytm-player.png", dest = "/usr/share/icons/hicolor/256x256/apps/ytm-player.png", mode = "644" },
    { source = "README.md", dest = "/usr/share/doc/ytm-player/README.md", mode = "644", doc = true },
]

[package.metadata.generate-rpm.requires]
glibc = ">= 2.35"
libgcc = "*"
alsa-lib = "*"
fontconfig = "*"
libxkbcommon = "*"

[package.metadata.generate-rpm.recommends]
libxkbcommon-x11 = "*"
libwayland-client = "*"
libXcursor = "*"
pipewire-alsa = "*"
