[package]
name = "ytm-player"
version = "0.2.0"
edition = "2024"
rust-version = "1.85"
description = "Lightweight cross-platform TUI music player synced with a YouTube Music account"
license = "MIT OR Apache-2.0"
publish = false

[[bin]]
name = "ytm"
path = "src/main.rs"

[features]
default = ["gui"]
# Desktop window (`ytm gui`); off => terminal-only, smaller binary.
gui = ["dep:slint", "dep:image"]

[dependencies]
# --- Async runtime -----------------------------------------------------------
tokio = { version = "1.47", features = [
    "rt-multi-thread",
    "macros",
    "process",   # yt-dlp child process
    "fs",
    "io-util",
    "sync",      # mpsc/watch channels between UI <-> player <-> sync
    "time",
    "signal",
    "net",       # loopback listener for the OAuth redirect
] }
futures-util = "0.3"

# --- HTTP / OAuth ------------------------------------------------------------
# rustls instead of OpenSSL: no system libssl on Linux, no vcpkg on Windows.
reqwest = { version = "0.12", default-features = false, features = [
    "rustls-tls",
    "http2",
    "charset",
    "system-proxy",
    "json",
    "gzip",
    "stream",
] }
# Reuses our reqwest (same 0.12 major) for the token exchange; PKCE is built in.
oauth2 = { version = "5.0", default-features = false, features = ["reqwest"] }
url = "2.5"
open = "5.3"         # opens the consent URL in the default browser

# --- Credentials ---------------------------------------------------------------
# v4 default ("v1" feature): Keychain on macOS, Credential Manager on Windows,
# Secret Service over pure-Rust zbus on Linux (no libdbus-dev needed).
keyring = "4.2"

# --- Audio -------------------------------------------------------------------
# rodio pulls cpal (CoreAudio / ALSA / WASAPI) and symphonia. Use `rodio::cpal`
# instead of a direct cpal dependency to avoid two cpal versions in the tree.
# Note: symphonia 0.5 has no Opus decoder, so we play AAC (m4a, itag 140).
rodio = { version = "0.22", default-features = false, features = [
    "playback",
    "mp4",          # symphonia isomp4 demuxer + AAC decoder
    "mp3",
    "vorbis",
    "flac",
    "wav",
] }

# --- Local storage -----------------------------------------------------------
# "bundled" compiles SQLite in: identical behavior on every OS, no system lib.
rusqlite = { version = "0.40", features = ["bundled", "chrono", "serde_json"] }

# --- TUI ---------------------------------------------------------------------
ratatui = "0.30"
# Must match ratatui's crossterm (0.29). "event-stream" gives async EventStream.
crossterm = { version = "0.29", features = ["event-stream"] }

# --- Config / paths / serialization ------------------------------------------
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "1.0"
directories = "6.0" # XDG on Linux, ~/Library on macOS, %APPDATA% on Windows
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }

# --- yt-dlp management -------------------------------------------------------
which = "8.0"
sha2 = "0.11"
hex = "0.4"

# --- Errors / logging --------------------------------------------------------
thiserror = "2.0"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2" # log to file: stdout belongs to the TUI

# --- GUI (optional) -----------------------------------------------------------
# Software renderer: no GPU stack; measured the lightest option (34 MB idle
# vs 49 MB FLTK, 78 MB egui). Royalty-free license: keep the "Made with
# Slint" attribution visible in the GUI.
slint = { version = "1.18", optional = true, default-features = false, features = [
    "std",
    "compat-1-2",
    "backend-winit",
    "renderer-software",
    # Window access to raise it when a second launch asks for it.
    "unstable-winit-030",
] }
zip = { version = "7.2.0", default-features = false, features = ["deflate"] }

# Process memory (macOS `proc_pid_rusage`), quiet SIGPIPE handling.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Album art (GUI): JPEG decode + scale of YouTube thumbnails only.
image = { version = "0.25", optional = true, default-features = false, features = ["jpeg"] }

# Media keys + "Now Playing" (MPRIS over pure-Rust zbus on Linux). Windows
# needs a window handle, so it's left out there for now.
[target.'cfg(not(windows))'.dependencies]
souvlaki = { version = "0.8", default-features = false, features = ["use_zbus"] }

# Main-thread run loop for media key handlers.
[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
