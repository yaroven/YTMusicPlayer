# Builds installers and binaries when a `v*` tag is pushed and attaches them
# (plus SHA256SUMS) to a GitHub Release:
#
#   Debian/Ubuntu  ytm-player_<v>_amd64.deb          (apt install ./…)
#   Fedora         ytm-player-<v>-1.x86_64.rpm       (dnf install ./…)
#   Arch           ytm-player-<v>-1-x86_64.pkg.tar.zst (pacman -U …)
#   Windows        ytm-player-<v>-setup-x64.exe      (setup wizard)
#   macOS          ytm-player-<v>-macos.pkg          (universal: arm64 + x86_64)
#   install.sh / install.ps1 downloads: ytm-<target>.tar.gz / .zip
#   uninstall.sh / uninstall.ps1
#
#   git tag v0.3.0 && git push origin v0.3.0
#
# Run it by hand (Actions > Release > Run workflow) to get the files as
# workflow artifacts without publishing a release.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    # Built on 22.04 (glibc 2.35): runs on Debian 12+, Ubuntu 22.04+,
    # current Fedora and Arch.
    runs-on: ubuntu-22.04
    env:
      TARGET: x86_64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v5
      - run: sudo apt-get update -q && sudo apt-get install -y -q libasound2-dev libfontconfig1-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: linux
      - run: cargo install --locked cargo-deb cargo-generate-rpm
      - run: cargo build --release --locked --target $TARGET
      - name: Package
        run: |
          v=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          mkdir -p dist
          tar -czf dist/ytm-$TARGET.tar.gz -C target/$TARGET/release ytm
          (cd dist && sha256sum ytm-$TARGET.tar.gz > ytm-$TARGET.tar.gz.sha256)
          cargo deb --no-build --no-strip --target $TARGET --output dist/ytm-player_${v}_amd64.deb
          cargo generate-rpm --target $TARGET --output dist/ytm-player-${v}-1.x86_64.rpm
          cp target/$TARGET/release/ytm dist/ytm-linux-x86_64
          ls -l dist
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/*

  arch:
    needs: linux
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: linux
          path: linux
      - name: makepkg
        run: |
          v=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          mkdir -p /tmp/pkg dist
          cp packaging/arch/PKGBUILD packaging/linux/ytm-player.desktop assets/ytm-player.png /tmp/pkg/
          cp linux/ytm-linux-x86_64 /tmp/pkg/ytm
          sed -i "s/^pkgver=.*/pkgver=$v/" /tmp/pkg/PKGBUILD
          useradd -m builder
          chown -R builder /tmp/pkg
          su builder -c 'cd /tmp/pkg && makepkg -fd --noconfirm'
          cp /tmp/pkg/*.pkg.tar.zst dist/
      - name: Install and run
        run: |
          # pacman's download sandbox doesn't work in containers.
          sed -i '/^DownloadUser/d' /etc/pacman.conf
          pacman -Sy --noconfirm --disable-sandbox
          pacman -U --noconfirm --disable-sandbox dist/*.pkg.tar.zst
          ytm --help | head -3
          test -f /usr/share/applications/ytm-player.desktop
      - uses: actions/upload-artifact@v4
        with:
          name: arch
          path: dist/*

  # The .deb and .rpm must install with their declared dependencies.
  verify-linux:
    needs: linux
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { image: "debian:12", install: "apt-get update -q && apt-get install -y -q ./linux/*.deb" }
          - { image: "ubuntu:24.04", install: "apt-get update -q && apt-get install -y -q ./linux/*.deb" }
          - { image: "fedora:latest", install: "dnf install -y ./linux/*.rpm" }
    container: ${{ matrix.image }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: linux
          path: linux
      - run: ${{ matrix.install }}
      - run: ytm --help | head -3 && test -f /usr/share/applications/ytm-player.desktop

  windows:
    runs-on: windows-latest
    env:
      TARGET: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: windows
      - run: cargo build --release --locked --target $env:TARGET
      - name: Package
        shell: pwsh
        run: |
          $v = (Select-String -Path Cargo.toml -Pattern '^version = "(.*)"').Matches[0].Groups[1].Value
          New-Item -ItemType Directory dist | Out-Null
          $bin = "target\$env:TARGET\release"
          & "$bin\ytm.exe" --help | Select-Object -First 3
          Compress-Archive "$bin\ytm.exe" "dist\ytm-$env:TARGET.zip"
          $hash = (Get-FileHash "dist\ytm-$env:TARGET.zip" -Algorithm SHA256).Hash.ToLower()
          "$hash  ytm-$env:TARGET.zip" | Out-File -Encoding ascii "dist\ytm-$env:TARGET.zip.sha256"
          choco install innosetup -y --no-progress | Out-Null
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /Q "/DAppVersion=$v" "/DBinDir=$PWD\$bin" "/O$PWD\dist" packaging\windows\ytm-player.iss
          if ($LASTEXITCODE -ne 0) { throw "iscc failed" }
          Get-ChildItem dist
      - name: Silent install, run, uninstall
        shell: pwsh
        run: |
          $setup = Get-ChildItem dist\*-setup-x64.exe | Select-Object -First 1
          Start-Process $setup.FullName -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART' -Wait
          $exe = "$env:LOCALAPPDATA\Programs\ytm-player\ytm.exe"
          & $exe --help | Select-Object -First 3
          if (-not (Test-Path "$env:APPDATA\Microsoft\Windows\Start Menu\Programs\ytm-player.lnk")) { throw 'no Start menu entry' }
          Start-Process "$env:LOCALAPPDATA\Programs\ytm-player\unins000.exe" -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES' -Wait
          Start-Sleep 2
          if (Test-Path $exe) { throw 'uninstall left ytm.exe behind' }
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          key: macos
      - run: |
          cargo build --release --locked --target aarch64-apple-darwin
          cargo build --release --locked --target x86_64-apple-darwin
      - name: Package
        run: |
          v=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          mkdir -p dist
          for t in aarch64-apple-darwin x86_64-apple-darwin; do
            tar -czf dist/ytm-$t.tar.gz -C target/$t/release ytm
            (cd dist && shasum -a 256 ytm-$t.tar.gz > ytm-$t.tar.gz.sha256)
          done
          packaging/macos/build-pkg.sh "$v" "dist/ytm-player-$v-macos.pkg" \
            target/aarch64-apple-darwin/release/ytm target/x86_64-apple-darwin/release/ytm
          pkgutil --payload-files dist/*.pkg
      - name: Install and run
        run: |
          sudo installer -pkg dist/*-macos.pkg -target /
          ytm --help | head -3
          lipo -archs /Applications/ytm-player.app/Contents/MacOS/ytm-player
          codesign --verify /Applications/ytm-player.app
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/*

  release:
    needs: [linux, arch, verify-linux, windows, macos]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -f dist/ytm-linux-x86_64
          cp uninstall.sh uninstall.ps1 dist/
          (cd dist && sha256sum -- * | grep -v '\.sha256$' > SHA256SUMS)
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --generate-notes
