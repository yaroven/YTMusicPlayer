# Android app: core tests (offline), then a release APK. Runs on Android
# changes; the Release workflow calls it to attach the APK to a release.
# Signed with the ANDROID_KEYSTORE_* secrets when they exist (updates then
# install over each other), else with the runner's debug key.
name: Android

on:
  push:
    branches: [main]
    paths: ["android/**", "ios/clients.json", "ios/YTMKit/Sources/YTMKit/Resources/**", ".github/workflows/android.yml"]
  pull_request:
    paths: ["android/**", "ios/clients.json", "ios/YTMKit/Sources/YTMKit/Resources/**", ".github/workflows/android.yml"]
  workflow_dispatch:
  workflow_call:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Keystore
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        if: env.KEYSTORE != ''
        run: |
          echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "ANDROID_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
      - name: Test and build
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          export BUILD_NUMBER=$(git rev-list --count HEAD)
          ./gradlew --no-daemon :core:test :app:lintRelease :app:assembleRelease
      - name: Package
        run: |
          v=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk "dist/yarek-music-$v.apk"
          ls -l dist
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: dist/*
