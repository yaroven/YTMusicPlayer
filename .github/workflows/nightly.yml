# Live checks against YouTube Music, LRCLIB and GitHub: they catch upstream
# changes (a renamed JSON field, a new yt-dlp requirement) before users do.
# Not on push: they need the network and the services can be flaky.
name: Nightly (live services)

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  live:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - run: sudo apt-get update -q && sudo apt-get install -y -q libasound2-dev libfontconfig1-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: YouTube Music catalog, lyrics, releases
        run: cargo test --locked -- --ignored live_catalog finds_synced_lyrics_live checks_github_live
      # YouTube's player endpoints challenge datacenter IPs (like GitHub's)
      # — measured 2026-10-02: loudness comes back empty there; a failure
      # here is a hint to check locally, not proof the player is broken.
      - name: yt-dlp and loudness (YouTube's player endpoints)
        continue-on-error: true
        run: cargo test --locked -- --ignored resolves_real_video migrates_onefile_to_onedir live_loudness
