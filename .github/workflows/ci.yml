# Lint + tests on Linux, build + tests on Windows. macOS is covered by the
# release workflow and local development (macOS runner minutes cost 10x on
# private repositories).
name: CI

on:
  push:
    branches: [main]
  pull_request:

# Superseded PR runs are cancelled; every push to main is checked fully.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - run: sudo apt-get update -q && sudo apt-get install -y -q libasound2-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked
      - name: Lint install script
        run: shellcheck install.sh

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked
      - name: Installer (source build, non-interactive)
        shell: pwsh
        run: ./install.ps1 -FromSource -NoLaunch -Yes
