# XcodeGen spec for the iPhone app: `xcodegen generate` (CI does it; the
# .xcodeproj isn't committed).
name: YarekMusic
options:
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en
packages:
  YTMKit:
    path: YTMKit
targets:
  YarekMusic:
    type: application
    platform: iOS
    sources:
      - App/Sources
      - App/Resources
    dependencies:
      - package: YTMKit
    scheme: {}
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Yarek Music
        # English and Ukrainian: iOS offers the choice in Settings → Yarek Music.
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, uk]
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        LSApplicationCategoryType: public.app-category.music
        UIBackgroundModes: [audio]
        # Downloads show in the Files app (On My iPhone → Yarek Music).
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIUserInterfaceStyle: Dark
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.yarek.music
        PRODUCT_NAME: YarekMusic
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Manual
        CODE_SIGNING_ALLOWED: "NO"
        ENABLE_PREVIEWS: "NO"
        DEAD_CODE_STRIPPING: "YES"
